tags:
  - Auth
summary: Login user
operationId: loginUser
description: Login user
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: User's email
    type: string
    example: dianazinevy@email.com
  password:
    description: User's password
    type: string
    example: 12324355
responses:
  '200':
    description: Login user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in an user!
            data:
              type: object
              $ref: '../../conponents/schemas/user.yaml'
  '401':
    $ref: '../../conponents/responses/401.yaml'
  '500':
    $ref: '../../conponents/responses/500.yaml'
