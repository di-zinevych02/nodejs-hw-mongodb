tags:
  - Contacts
summary: Update a contact by Id
operationId: updateContact
description: Updates information about contact by Id.
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: Contact's name
            type: string
            example: Dianazinevy
          phoneNumber:
            description: Contact's phone number
            type: string
            example: +38434788578955
          email:
    description: Contact's email
    type: string
    example: dianazinevy@email.com
  isFavourite:
    description: Whether is contact is favourite
    type: boolean
    example: false
    default: false
  contactType:
    description: Contact's type
    type: string
    enum: ['work', 'home', 'personal']
    example: work
    default: personal
  userId:
    description: Contact's user id
    type: string
    example: 684ac58b8fb1fcb5edf85e24
  photo:
    description: Link to contact's photo
    type: string
    format: binary
    example: https://res.cloudinary.com/dkfmkxxno/image/upload/v1750185563/qd7klnaxwdblue8hienz.png
    default: null
    responses:
  '200':
    description: 'Successfully patched a contact!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact 684ac58b8fb1fcb5edf85e24!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
