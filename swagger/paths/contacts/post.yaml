tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
  - name
  - phoneNumber
  - contactType
        properties:
          name:
    description: Contact's name
    type: string
    example: Dianazinevy
  phoneNumber:
    description: Contact's phone number
    type: string
    example: +38434788578955
  email:
    description: Contact's email
    type: string
    example: dianazinevy@email.com
  isFavourite:
    description: Whether is contact is favourite
    type: boolean
    example: false
    default: false
  contactType:
    description: Contact's type
    type: string
    enum: ['work', 'home', 'personal']
    example: work
    default: personal
  userId:
    description: Contact's user id
    type: string
    example: 684ac58b8fb1fcb5edf85e24
  photo:
    description: Link to contact's photo
    type: string
    format: binary
    example: https://res.cloudinary.com/dkfmkxxno/image/upload/v1750185563/qd7klnaxwdblue8hienz.png
    default: null
          
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
    '400':
    $ref: ../../components/responses/400.yaml
    '500':
    $ref: ../../../components/responses/500.yaml
