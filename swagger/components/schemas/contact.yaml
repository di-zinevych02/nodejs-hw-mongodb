type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
properties:
  _id:
    description: Contact's id
    type: string
    example: 6851b65ce2e27b777f8a62ce
  name:
    description: Contact's name
    type: string
    example: Dianazinevy
  phoneNumber:
    description: Contact's phone number
    type: string
    example: +38434788578955
  email:
    description: Contact's email
    type: string
    example: dianazinevy@email.com
  isFavourite:
    description: Whether is contact is favourite
    type: boolean
    example: false
    default: false
  contactType:
    description: Contact's type
    type: string
    enum: ['work', 'home', 'personal']
    example: work
    default: personal
  userId:
    description: Contact's user id
    type: string
    example: 684ac58b8fb1fcb5edf85e24
  photo:
    description: Link to contact's photo
    type: string
    format: url
    example: https://res.cloudinary.com/dkfmkxxno/image/upload/v1750185563/qd7klnaxwdblue8hienz.png
    default: null
  createdAt:
    description: Contact's creation date
    type: string
    format: date-time
    example: 2023-10-01T12:00:00Z
  updatedAt:
    description: Contact's update date
    type: string
    format: date-time
    example: 2023-10-02T12:00:00Z
